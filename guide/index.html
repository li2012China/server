<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加入服务器 - Overworld</title>
  <link rel="stylesheet" href="/server/style.css" />
  <link id="favicon" rel="icon" href="" type="image/png" />
  <style>
    .guide-section {
      margin-top: 60px;
      padding: 80px 30px;
      min-height: calc(100vh - 60px - 200px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .guide-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .guide-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .guide-title {
      font-size: 42px;
      font-weight: 300;
      color: var(--primary-color);
      margin-bottom: 15px;
      font-family: 'Fusion Pixel', sans-serif;
    }

    .guide-subtitle {
      font-size: 18px;
      color: #a2a2a2;
    }

    .version-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      max-width: 800px;
      width: 100%;
      margin-bottom: 60px;
    }

    .version-card {
      background-color: #2a2a2a;
      border: 1px solid #333;
      border-top: 3px solid var(--primary-color);
      padding: 40px 30px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: block;
    }

    .version-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .version-card:active {
      transform: translateY(-2px);
    }

    .version-card-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .version-card-title {
      font-size: 28px;
      color: white;
      font-weight: 400;
      margin-bottom: 10px;
      font-family: 'MinecraftTen', sans-serif;
    }

    .version-card-ver {
      font-size: 14px;
      color: #a2a2a2;
      margin-bottom: 25px;
    }

    .version-card-btn {
      display: inline-block;
      padding: 10px 30px;
      background-color: var(--primary-color);
      color: white;
      font-size: 14px;
      font-family: 'Fusion Pixel', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: filter 0.2s ease;
    }

    .version-card:hover .version-card-btn {
      filter: brightness(1.1);
    }

    .server-address-block {
      background-color: #2a2a2a;
      border: 1px solid #333;
      border-left: 3px solid var(--primary-color);
      padding: 20px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .server-address-label {
      font-size: 12px;
      color: #a2a2a2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .server-address-value {
      font-size: 18px;
      color: white;
      font-family: 'MinecraftTen', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .copy-btn {
      padding: 4px 12px;
      background-color: #333;
      border: 1px solid #444;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Fusion Pixel', sans-serif;
      text-transform: uppercase;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .guide-tip {
      margin-top: 30px;
      font-size: 13px;
      color: #666;
      text-align: center;
      max-width: 500px;
    }

    @media (max-width: 600px) {
      .version-grid {
        grid-template-columns: 1fr;
      }

      .guide-title {
        font-size: 32px;
      }
    }
  </style>
</head>
<body id="top">
  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="/server/index.html" class="logo">
      <img id="server-icon" src="" alt="服务器图标" class="logo-icon-img" style="display: none;" />
      <div class="logo-icon" id="logo-fallback">⛏</div>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="/server/index.html">首页</a>
      <a href="/server/menu.html">综合菜单</a>
      <a href="/server/hall/s4.html">名人堂</a>
      <a href="https://li2012china.github.io/" target="_blank">主站</a>
      <a href="https://qm.qq.com/q/Lep8hVQm0q" target="_blank" class="qq-group-btn">加入QQ群</a>
    </div>
    <button class="menu-toggle" id="menu-toggle" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
  <!-- 菜单背景遮罩 -->
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>

  <!-- 引导主内容 -->
  <section class="guide-section">
    <div class="guide-header">
      <div class="guide-icon">🎮</div>
      <h1 class="guide-title">加入 Overworld</h1>
      <p class="guide-subtitle">选择你的游戏版本，开始冒险</p>
    </div>

    <div class="version-grid">
      <!-- Java 版 -->
      <a class="version-card" href="minecraft://?addExternalServer=Overworld|103.85.86.51:17125">
        <div class="version-card-icon">☕</div>
        <div class="version-card-title">Java 版</div>
        <div class="version-card-ver">支持 1.8 — 1.21.11</div>
        <span class="version-card-btn">直接加入</span>
      </a>

      <!-- 基岩版 -->
      <a class="version-card" href="/server/guide/join.html">
        <div class="version-card-icon">🧱</div>
        <div class="version-card-title">基岩版</div>
        <div class="version-card-ver">支持最新版</div>
        <span class="version-card-btn">直接加入</span>
      </a>
    </div>

    <div class="server-address-block">
      <div class="server-address-label">服务器地址</div>
      <div class="server-address-value">
        103.85.86.51:17125
        <button class="copy-btn" onclick="copyToClipboard('103.85.86.51:17125')">复制</button>
      </div>
    </div>

    <p class="guide-tip">
      点击上方卡片将自动打开 Minecraft 并添加服务器。<br/>
      如未能自动打开，可复制服务器地址手动添加。
    </p>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <p>&copy; <span id="current-year"></span> Overworld. 作者：马太Matthew</p>
    <div class="footer-links">
      <a href="#top">返回顶部</a>
      <a href="/server/3dmap.html" target="_blank">3D地图</a>
      <a href="http://play.simpfun.cn:42651/" target="_blank">后台</a>
      <a href="https://space.bilibili.com/3546739839601525" target="_blank" class="social-link"></a>
      <a href="https://www.douyin.com/user/MS4wLjABAAAADCpbCTAxqq4cgc_nLj_8by-rzA1ZC_QGfJSiyCJJKYk?from_tab_name=main" target="_blank" class="social-link"></a>
      <a href="https://youtube.com/@li2012china" target="_blank" class="social-link"></a>
    </div>
    <p class="footer-made-with">Made with ❤️ and AI.</p>
  </footer>

  <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script>
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制: ' + text);
      }).catch(() => {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('已复制: ' + text);
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    document.getElementById('current-year').textContent = new Date().getFullYear();

    function toggleMenu() {
      const navLinks = document.getElementById('nav-links');
      const menuToggle = document.getElementById('menu-toggle');
      const menuOverlay = document.getElementById('menu-overlay');
      navLinks.classList.toggle('active');
      menuToggle.classList.toggle('active');
      menuOverlay.classList.toggle('active');
    }

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        const navLinks = document.getElementById('nav-links');
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.getElementById('menu-overlay');
        navLinks.classList.remove('active');
        menuToggle.classList.remove('active');
        menuOverlay.classList.remove('active');
      });
    });

    async function loadServerIcon() {
      try {
        const response = await fetch('https://motdbe.blackbe.work/api/java?host=play.simpfun.cn:17125');
        if (response.ok) {
          const data = await response.json();
          if (data.favicon) {
            const serverIcon = document.getElementById('server-icon');
            const logoFallback = document.getElementById('logo-fallback');
            const favicon = document.getElementById('favicon');
            serverIcon.src = data.favicon;
            serverIcon.style.display = 'block';
            logoFallback.style.display = 'none';
            favicon.href = data.favicon;
          }
        }
      } catch (error) {
        console.error('加载服务器图标失败:', error);
      }
    }

    function isMemorialDay() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      return (month === 5 && (day === 16 || day === 17));
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (isMemorialDay()) {
        document.body.classList.add('memorial-day');
      }
      loadServerIcon();
    });
  </script>
</body>
</html>
